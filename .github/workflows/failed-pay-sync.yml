name: Failed Pay Sync

on:
  schedule:
    - cron: '45 * * * *'  # every hour at :45, staggered from other workflows
  workflow_dispatch:        # allow manual trigger from GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run failed pay sync
        env:
          HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
        run: node scripts/failed-pay-sync.mjs
