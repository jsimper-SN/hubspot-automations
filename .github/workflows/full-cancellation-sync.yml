name: Full Customer Cancellation Sync

on:
  schedule:
    - cron: '15 * * * *'  # every hour at :15, staggered from the other two
  workflow_dispatch:        # allow manual trigger from GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run full cancellation sync
        env:
          HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
        run: node scripts/full-cancellation-sync.mjs
